<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        section {
            margin: 2rem 0;
            padding: 2rem 0;
        }
        
        h1 {
            margin-bottom: 0.5rem;
        }
        
        p {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Welcome to My Portfolio</h1>
            <p>Your name / Professional tagline here</p>
        </div>
    </header>
    
    <main class="container">
        <section id="about">
            <h2>About Me</h2>
            <p>Add your bio and introduction here...</p>
        </section>
        
        <section id="projects">
            <h2>Projects</h2>
            <p>Add your projects here...</p>
        </section>
        
        <section id="skills">
            <h2>Skills</h2>
            <p>Add your skills here...</p>
        </section>
        
        <section id="contact">
            <h2>Contact</h2>
            <p>Add your contact information here...</p>
        </section>
    </main>
</body>
</html>
